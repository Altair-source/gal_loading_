<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0876bd">
<title>Garry's Mod | Loading</title>
<style>
:root{color-scheme:dark;--blue:#0879c3;--deep:#07548e;--white:#fff;--lime:#75c928;--yellow:#ffd328}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif}body{min-height:100vh;overflow:hidden;color:#fff;background:radial-gradient(ellipse at 50% 44%,#1686cf 0,#0874ba 44%,#075a99 100%);display:grid;place-items:center}
body:before{content:"";position:fixed;inset:0;opacity:.12;background-image:linear-gradient(transparent 97%,rgba(255,255,255,.16) 98%),linear-gradient(90deg,transparent 97%,rgba(255,255,255,.12) 98%);background-size:56px 56px;mask-image:linear-gradient(transparent,black 25%,black 75%,transparent);pointer-events:none}
.glow{position:absolute;width:min(62vw,680px);aspect-ratio:1;border-radius:50%;background:#34a9ed;filter:blur(110px);opacity:.16;left:50%;top:44%;transform:translate(-50%,-50%)}
main{position:relative;width:min(100% - 36px,740px);text-align:center;padding:38px 24px 32px;display:flex;flex-direction:column;align-items:center;animation:appear .9s ease both}
.brand{width:clamp(160px,27vw,275px);height:auto;overflow:visible;filter:drop-shadow(0 18px 35px rgba(0,30,68,.24));animation:float 5s ease-in-out infinite}
.eyebrow{margin:31px 0 8px;font-size:11px;letter-spacing:.34em;font-weight:800;color:#ccecff;text-transform:uppercase}
h1{font-size:clamp(27px,5vw,42px);margin:0;font-weight:850;letter-spacing:-.045em;text-shadow:0 2px 16px #04518a55}
.subtitle{margin:12px 0 29px;color:#d4eeff;font-size:14px;letter-spacing:.02em}
.loadbox{width:min(100%,390px);text-align:left;padding:0 4px}.loadrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;color:#eaf7ff;font-size:11px;font-weight:700;letter-spacing:.09em}.percent{font-variant-numeric:tabular-nums}.track{height:5px;background:#ffffff38;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#b1ee58,#ffdf49);box-shadow:0 0 15px #ffee7b;transition:width .5s ease}
.tip{height:20px;margin:14px 0 28px;font-size:12px;color:#c4e6fb;opacity:.92}
.workshop{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border:1px solid #ffffff83;border-radius:5px;background:#ffffff14;color:#fff;text-decoration:none;font-size:13px;font-weight:750;letter-spacing:.015em;transition:background .2s,border-color .2s,transform .2s;backdrop-filter:blur(8px)}.workshop:hover{background:#ffffff2c;border-color:#fff;transform:translateY(-2px)}.workshop:focus-visible{outline:3px solid #ffe158;outline-offset:4px}.steam{width:18px;height:18px;fill:currentColor}.footer{position:fixed;bottom:18px;left:20px;right:20px;display:flex;justify-content:space-between;color:#b9e2fb9c;font-size:10px;letter-spacing:.13em}.footer span:last-child{font-variant-numeric:tabular-nums}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-height:650px){main{padding-top:16px;padding-bottom:20px}.brand{width:clamp(110px,23vh,180px)}.eyebrow{margin-top:16px}.subtitle{margin:8px 0 18px}.tip{margin:10px 0 16px}.footer{bottom:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main>
<svg class="brand" viewBox="0 0 300 300" role="img" aria-label="Garry's Mod cube logo">
 <polygon points="150,12 282,88 282,212 150,288 18,212 18,88" fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
 <polygon points="150,36 258,99 150,162 42,99" fill="#ffd329"/>
 <polygon points="42,99 150,162 150,264 42,202" fill="#75c928"/>
 <polygon points="258,99 150,162 150,264 258,202" fill="#0663a6"/>
</svg>
<p class="eyebrow">Garry's Mod</p>
<h1>게임에 접속하는 중</h1>
<p class="subtitle">잠시만 기다려 주세요. 곧 샌드박스가 시작됩니다.</p>
<section class="loadbox" aria-label="로딩 상태">
 <div class="loadrow"><span id="status">서버에 연결하는 중</span><span class="percent" id="percent">0%</span></div>
 <div class="track" role="progressbar" aria-label="게임 로딩 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
</section>
<p class="tip" id="tip">팁: 창작마당 콘텐츠를 구독하면 서버에 더 빨리 접속할 수 있어요.</p>
<a class="workshop" href="https://steamcommunity.com/sharedfiles/filedetails/?id=3510603701" target="_blank" rel="noopener noreferrer">
 <svg class="steam" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-9.92 8.7l5.38 2.22a3.05 3.05 0 0 1 1.73-.54l2.4-3.48v-.05a4.03 4.03 0 1 1 4.03 4.03h-.1l-3.42 2.44a3.08 3.08 0 1 1-3.16-3.64l-3.85-1.59A10 10 0 1 0 12 2Zm3.62 5.44a2.41 2.41 0 1 0 0 4.82 2.41 2.41 0 0 0 0-4.82ZM8.67 14.1a1.83 1.83 0 1 0 1.83 1.83 1.83 1.83 0 0 0-1.83-1.83Z"/></svg>
 Open Workshop Collection <span aria-hidden="true">↗</span>
</a>
</main>
<div class="footer"><span>GARRY'S MOD · SANDBOX</span><span id="clock">00:00</span></div>
<script>
(()=>{const fill=document.querySelector('.fill'),percent=document.querySelector('#percent'),status=document.querySelector('#status'),bar=document.querySelector('[role="progressbar"]'),clock=document.querySelector('#clock');let n=0;const phrases=['서버에 연결하는 중','애드온을 확인하는 중','월드를 불러오는 중','거의 완료됐어요'];const started=Date.now();const timer=setInterval(()=>{n=Math.min(96,n+(Math.random()*2.5+.45));fill.style.width=n+'%';percent.textContent=Math.floor(n)+'%';bar.setAttribute('aria-valuenow',Math.floor(n));status.textContent=phrases[Math.min(3,Math.floor(n/25))];const s=Math.floor((Date.now()-started)/1000);clock.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(n>=96)clearInterval(timer)},450)})();
</script>
</body>
</html>
